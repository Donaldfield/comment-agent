<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电商评价智能分析看板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#f0f2f5;color:#333}
.header{background:#1a1a2e;color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:20px;font-weight:600}
.header select{padding:6px 12px;border-radius:6px;border:1px solid #555;background:#2d2d44;color:#fff;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:20px}
.card{background:#fff;border-radius:10px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card h3{font-size:13px;color:#888;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.card .value{font-size:28px;font-weight:700}
.card .sub{font-size:12px;color:#999;margin-top:4px}
.positive{color:#22c55e}.negative{color:#ef4444}.neutral{color:#3b82f6}.warning{color:#f59e0b}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 20px 20px}
.chart-card{background:#fff;border-radius:10px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.chart-card h3{margin-bottom:12px;font-size:15px}
.table-card{background:#fff;border-radius:10px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin:0 20px 20px}
.table-card h3{margin-bottom:12px;font-size:15px}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:8px 12px;background:#f8f9fa;font-size:12px;color:#666;border-bottom:2px solid #e5e7eb}
td{padding:8px 12px;font-size:13px;border-bottom:1px solid #eee}
.severity-high{background:#fee2e2;color:#dc2626;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.severity-medium{background:#fef3c7;color:#d97706;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.severity-low{background:#dbeafe;color:#2563eb;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.alert-critical{background:#fecaca;border-left:3px solid #dc2626}
.alert-warning{background:#fef3c7;border-left:3px solid #d97706}
.alert-info{background:#dbeafe;border-left:3px solid #2563eb}
.rag-section{margin:0 20px 20px}
.rag-section input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px}
.rag-results{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.rag-card{background:#fff;padding:12px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.06);font-size:13px}
.loading{text-align:center;padding:40px;color:#999}
</style>
</head>
<body>

<div class="header">
  <h1>电商评价智能分析看板</h1>
  <select id="productSelect" onchange="loadProduct()">
    <option value="">选择商品...</option>
  </select>
</div>

<div class="grid" id="summary">
  <div class="card"><h3>总评价数</h3><div class="value" id="totalReviews">-</div></div>
  <div class="card"><h3>好评率</h3><div class="value positive" id="positiveRate">-</div></div>
  <div class="card"><h3>差评率</h3><div class="value negative" id="negativeRate">-</div></div>
  <div class="card"><h3>综合情感分</h3><div class="value" id="sentimentScore">-</div></div>
</div>

<div class="charts">
  <div class="chart-card">
    <h3>ABSA 细粒度情感雷达图</h3>
    <canvas id="radarChart" height="300"></canvas>
  </div>
  <div class="chart-card">
    <h3>每日情感走势</h3>
    <canvas id="timelineChart" height="300"></canvas>
  </div>
</div>

<div class="table-card">
  <h3>痛点 TOP 排行</h3>
  <table><thead><tr><th>维度</th><th>描述</th><th>提及次数</th><th>严重程度</th></tr></thead>
  <tbody id="painPointsTable"><tr><td colspan="4" class="loading">请选择商品加载数据</td></tr></tbody></table>
</div>

<div class="rag-section">
  <h3 style="margin-bottom:8px">RAG 历史问题检索</h3>
  <input type="text" id="ragInput" placeholder="输入关键词查询历史类似问题，例如：面料起球 客服态度差" onkeydown="if(event.key==='Enter')searchRAG()">
  <div class="rag-results" id="ragResults"></div>
</div>

<div class="table-card">
  <h3>预警日志</h3>
  <table><thead><tr><th>时间</th><th>级别</th><th>标题</th><th>详情</th></tr></thead>
  <tbody id="alertsTable"><tr><td colspan="4" class="loading">选择商品后加载</td></tr></tbody></table>
</div>

<script>
// ── State ──
let currentProduct = '';
let radarChart = null, timelineChart = null;

// ── Init ──
async function init() {
    try {
        const r = await fetch('/api/v1/health');
        const h = await r.json();
        document.querySelector('.header').insertAdjacentHTML('beforeend',
            `<span style="font-size:11px;opacity:.7">v${h.version} | LLM: ${h.llm_available?'ON':'OFF'} | Milvus: ${h.milvus_available?'ON':'OFF'}</span>`);
    } catch(e) {}

    // Load products from stats endpoint (poll known IDs)
    const sampleIds = ['SKU001','SKU002','SKU003','SKU123'];
    const sel = document.getElementById('productSelect');
    for (const id of sampleIds) {
        sel.innerHTML += `<option value="${id}">${id}</option>`;
    }
}

// ── Load product data ──
async function loadProduct() {
    currentProduct = document.getElementById('productSelect').value;
    if (!currentProduct) return;

    const [stats, analysis] = await Promise.all([
        fetch(`/api/v1/reviews/${currentProduct}/stats`).then(r => r.json()),
        fetch(`/api/v1/analysis/${currentProduct}`).then(r => r.json()),
    ]);

    // Summary cards
    document.getElementById('totalReviews').textContent = analysis.total_reviews || 0;
    document.getElementById('positiveRate').textContent = analysis.positive_pct || '0%';
    document.getElementById('negativeRate').textContent = analysis.negative_pct || '0%';
    document.getElementById('sentimentScore').textContent = (analysis.sentiment_score || 0).toFixed(1);

    // Radar chart (fetch ABSA data)
    fetchABSA(currentProduct);
    // Timeline
    renderTimeline(analysis);
    // Pain points
    renderPainPoints(analysis);
    // Alerts
    renderAlerts(analysis);
}

// ── ABSA fetch ──
async function fetchABSA(productId) {
    try {
        const r = await fetch(`/api/v1/analysis/${productId}/absa`);
        const absa = await r.json();
        renderRadar(absa.radar_data || []);
    } catch(e) {
        console.warn('ABSA fetch failed, using empty data', e);
        renderRadar([]);
    }
}

// ── Charts ──
function renderRadar(radarData) {
    const ctx = document.getElementById('radarChart').getContext('2d');
    if (radarChart) radarChart.destroy();

    const labels = radarData.map(d => d.aspect_cn);
    const positiveData = radarData.map(d => d.positive_pct);
    const negativeData = radarData.map(d => d.negative_pct);

    radarChart = new Chart(ctx, {
        type: 'radar',
        data: {
            labels: labels.length ? labels : ['质量','物流','包装','尺码','色差','客服','性价比'],
            datasets: [{
                label: '正面率 %',
                data: positiveData.length ? positiveData : [0,0,0,0,0,0,0],
                backgroundColor: 'rgba(34,197,94,.2)',
                borderColor: '#22c55e',
                borderWidth: 2,
                pointRadius: 4,
            },{
                label: '负面率 %',
                data: negativeData.length ? negativeData : [0,0,0,0,0,0,0],
                backgroundColor: 'rgba(239,68,68,.1)',
                borderColor: '#ef4444',
                borderWidth: 2,
                pointRadius: 4,
            }]
        },
        options: {
            responsive: true,
            scales: { r: { beginAtZero: true, max: 100, ticks: { stepSize: 20 } } },
            plugins: { legend: { position: 'bottom' } }
        }
    });
}

function renderTimeline(data) {
    const ctx = document.getElementById('timelineChart').getContext('2d');
    if (timelineChart) timelineChart.destroy();

    const days = data.daily_stats || [];
    timelineChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: days.map(d => d.date),
            datasets: [
                { label: '好评', data: days.map(d => d.positive), backgroundColor: '#22c55e', stack: 'sentiment' },
                { label: '中评', data: days.map(d => d.neutral), backgroundColor: '#3b82f6', stack: 'sentiment' },
                { label: '差评', data: days.map(d => d.negative), backgroundColor: '#ef4444', stack: 'sentiment' },
            ]
        },
        options: {
            responsive: true,
            scales: { x: { stacked: true }, y: { stacked: true } },
            plugins: { legend: { position: 'bottom' } }
        }
    });
}

// ── Pain points table ──
function renderPainPoints(data) {
    const tbody = document.getElementById('painPointsTable');
    const pp = data.pain_points || [];
    if (!pp.length) { tbody.innerHTML = '<tr><td colspan="4">暂无痛点数据</td></tr>'; return; }

    tbody.innerHTML = pp.map(p => `
        <tr>
            <td>${p.category || '-'}</td>
            <td>${p.description || '-'}</td>
            <td>${p.frequency || 0}</td>
            <td><span class="severity-${p.severity || 'low'}">${(p.severity||'low').toUpperCase()}</span></td>
        </tr>`).join('');
}

// ── Alerts table ──
function renderAlerts(data) {
    const tbody = document.getElementById('alertsTable');
    const alerts = data.alerts || [];
    if (!alerts.length) { tbody.innerHTML = '<tr><td colspan="4">无预警</td></tr>'; return; }

    tbody.innerHTML = alerts.slice(0,10).map(a => `
        <tr class="alert-${a.level || 'info'}">
            <td style="font-size:11px">${(a.triggered_at||'').substr(0,16)}</td>
            <td><span style="font-weight:600;color:${a.level==='critical'?'#dc2626':a.level==='warning'?'#d97706':'#2563eb'}">${(a.level||'').toUpperCase()}</span></td>
            <td>${a.title || '-'}</td>
            <td style="font-size:12px;max-width:300px">${(a.detail||'').substr(0,100)}</td>
        </tr>`).join('');
}

// ── RAG search ──
async function searchRAG() {
    const q = document.getElementById('ragInput').value.trim();
    if (!q) return;

    document.getElementById('ragResults').innerHTML = '<div class="loading">搜索中...</div>';

    try {
        const r = await fetch('/api/v1/rag/query', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({query: q, product_id: currentProduct, top_k: 10})
        });
        const data = await r.json();

        let html = '';
        if (data.historical_issues && data.historical_issues.length) {
            html += data.historical_issues.slice(0,3).map(i =>
                `<div class="rag-card"><strong>历史问题</strong><p>${i.text||''}</p></div>`).join('');
        }
        if (data.similar_reviews && data.similar_reviews.length) {
            html += data.similar_reviews.slice(0,3).map(r =>
                `<div class="rag-card"><strong>相似评价</strong><p>${(r.text||'').substr(0,150)}</p></div>`).join('');
        }
        document.getElementById('ragResults').innerHTML = html || '<div style="color:#999">未找到相似结果（可能 Milvus 未启动或知识库为空）</div>';
    } catch(e) {
        document.getElementById('ragResults').innerHTML = '<div style="color:#ef4444">查询失败: '+e.message+'</div>';
    }
}

// ── Start ──
init();
</script>
</body>
</html>
